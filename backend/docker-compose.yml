version: "3.9"

services:
  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: parkinsonvoice_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/parkinson_voice
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DEBUG=false
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./app/ml/models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - parkinsonvoice_net

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: parkinsonvoice_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parkinson_voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parkinsonvoice_net

  # ─── Nginx Reverse Proxy (optional) ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: parkinsonvoice_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - parkinsonvoice_net
    profiles:
      - production

volumes:
  postgres_data:

networks:
  parkinsonvoice_net:
    driver: bridge
